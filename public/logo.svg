<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dourado Metálico -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <!-- Gradiente Azul Noturno / Royal -->
    <linearGradient id="navyDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2a5c" />
      <stop offset="60%" stop-color="#081938" />
      <stop offset="100%" stop-color="#040d1e" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Gradiente da Atleta em Ataque -->
    <linearGradient id="playerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Gradiente do Banner Principal VÔLEY -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Sombra Elegante -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ==================== CÍRCULO EXTERNO E BORDAS ==================== -->
  <!-- Borda Externa Dourada -->
  <circle cx="250" cy="250" r="242" fill="#040d1e" stroke="url(#goldGrad)" stroke-width="9" />
  
  <!-- Anel Azul Royal -->
  <circle cx="250" cy="250" r="230" fill="url(#navyDeep)" stroke="#1d4ed8" stroke-width="7" />

  <!-- Detalhes em Arco Decorativos Superiores (Estilo Emblema Esportivo) -->
  <path d="M 55 250 A 195 195 0 0 1 445 250" fill="none" stroke="#2563eb" stroke-width="4" opacity="0.6" />
  <path d="M 75 250 A 175 175 0 0 1 425 250" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Estrelas Laterais no Aro Superior -->
  <g fill="url(#goldGrad)">
    <polygon points="90,145 93,153 101,153 95,158 97,166 90,161 83,166 85,158 79,153 87,153" transform="scale(0.8) translate(22, 35)" />
    <polygon points="410,145 413,153 421,153 415,158 417,166 410,161 403,166 405,158 399,153 407,153" transform="scale(0.8) translate(105, 35)" />
  </g>

  <!-- ==================== REDE DE VOLEIBOL DE FUNDO ==================== -->
  <g opacity="0.45">
    <!-- Poste Esquerdo e Direito -->
    <line x1="225" y1="165" x2="225" y2="245" stroke="#94a3b8" stroke-width="3" />
    <line x1="298" y1="160" x2="298" y2="245" stroke="#94a3b8" stroke-width="3" />
    <!-- Faixa Superior da Rede -->
    <line x1="220" y1="172" x2="302" y2="168" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    <!-- Faixa Inferior da Rede -->
    <line x1="220" y1="230" x2="302" y2="230" stroke="#64748b" stroke-width="2" />
    <!-- Malha Quadriculada da Rede -->
    <line x1="220" y1="184" x2="302" y2="182" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="220" y1="196" x2="302" y2="195" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="220" y1="208" x2="302" y2="208" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="220" y1="220" x2="302" y2="220" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
    <!-- Verticais da Malha -->
    <line x1="236" y1="172" x2="236" y2="230" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="248" y1="171" x2="248" y2="230" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="260" y1="170" x2="260" y2="230" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="272" y1="169" x2="272" y2="230" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="284" y1="169" x2="284" y2="230" stroke="#94a3b8" stroke-width="1.2" />
  </g>

  <!-- ==================== RASTROS DINÂMICOS DA BOLA ==================== -->
  <g fill="none" stroke-linecap="round">
    <path d="M 180 230 C 185 180, 210 145, 240 135" stroke="#38bdf8" stroke-width="11" opacity="0.85" />
    <path d="M 195 235 C 200 190, 220 155, 245 142" stroke="#f8fafc" stroke-width="5" opacity="0.95" />
    <path d="M 168 220 C 175 170, 205 130, 238 122" stroke="#1d4ed8" stroke-width="14" opacity="0.6" />
  </g>

  <!-- ==================== BOLA DE VOLEIBOL (OFICIAL TRICOLOR) ==================== -->
  <g transform="translate(248, 132)" filter="url(#dropShadow)">
    <!-- Base da Bola -->
    <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
    
    <!-- Painéis Azuis e Amarelos Clássicos de Vôlei de Alta Precisão -->
    <!-- Painel Curvo Amarelo Superior -->
    <path d="M -22 -23 C -5 -32, 18 -28, 28 -15 C 20 -10, 8 -12, -2 -14 C -12 -16, -18 -18, -22 -23 Z" fill="#fbbf24" stroke="#1e293b" stroke-width="2" />
    <!-- Painel Azul Central -->
    <path d="M -31 -5 C -30 -15, -15 -25, 0 -22 C 1 -10, -5 5, -14 16 C -24 10, -29 2, -31 -5 Z" fill="#2563eb" stroke="#1e293b" stroke-width="2" />
    <!-- Painel Amarelo Curvo Inferior -->
    <path d="M -14 16 C -2 28, 15 29, 26 19 C 20 12, 10 5, 0 -2 C -5 6, -10 11, -14 16 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2" />
    <!-- Painel Azul Direito -->
    <path d="M 0 -22 C 14 -20, 26 -8, 29 5 C 18 6, 8 2, 0 -2 C 0 -10, 0 -16, 0 -22 Z" fill="#1d4ed8" stroke="#1e293b" stroke-width="2" />
    <!-- Painel Branco Central -->
    <path d="M 0 -2 C 8 2, 18 6, 26 19 C 14 25, 0 24, -14 16 C -5 5, 1 -10, 0 -2 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <!-- Linhas de Costura Finas -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- ==================== SILHUETA DA ATLETA EM CORTE / ATAQUE ==================== -->
  <!-- Atleta saltando com arco corporal atlético, braço no golpe de ataque -->
  <g fill="url(#playerGrad)" filter="url(#dropShadow)">
    <!-- Cabeça e Rabo de Cavalo Dinâmico -->
    <circle cx="266" cy="164" r="9" />
    <path d="M 260 162 C 252 161, 246 166, 243 172 C 248 171, 255 168, 259 166 Z" />

    <!-- Braço Esquerdo (Equilíbrio no Ar) -->
    <path d="M 264 175 Q 278 174 282 166 Q 284 163 282 158 Q 277 166 264 178 Z" />

    <!-- Tronco Atlético em Extensão / Torção de Ataque -->
    <path d="M 263 173 C 269 173, 273 180, 270 196 C 267 206, 260 216, 256 226 C 253 222, 252 212, 254 200 C 256 188, 258 175, 263 173 Z" />

    <!-- Braço Direito (Armado para a Cortada / Braço Forte) -->
    <path d="M 268 174 C 274 168, 280 152, 276 142 C 274 138, 271 140, 270 145 C 269 152, 264 164, 261 171 Z" />
    <!-- Mão Espalmada na Batida -->
    <path d="M 276 142 C 278 138, 280 137, 282 140 C 281 144, 278 146, 275 144 Z" />

    <!-- Quadril e Pernas Fletidas (Típica Postura de Ataque em Suspensão) -->
    <!-- Perna Direita -->
    <path d="M 256 226 C 258 232, 264 238, 268 244 C 271 248, 268 252, 264 251 C 259 246, 252 238, 250 231 Z" />
    <!-- Perna Esquerda (Flexionada para Trás / Salto) -->
    <path d="M 253 226 C 246 230, 238 236, 234 242 C 230 245, 233 248, 238 246 C 244 242, 248 236, 252 230 Z" />
  </g>

  <!-- ==================== BANNER CENTRAL EM FAIXA "VÔLEY" ==================== -->
  <!-- Placa Base de Contorno Escuro -->
  <g filter="url(#dropShadow)">
    <!-- Base Arqueada do Escudo / Placa -->
    <path d="M 82 248 Q 250 228 418 248 L 428 308 Q 250 338 72 308 Z" fill="#040d1e" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Miolo Azul Profundo da Placa -->
    <path d="M 90 254 Q 250 236 410 254 L 418 302 Q 250 330 82 302 Z" fill="#0b2347" stroke="#1d4ed8" stroke-width="2" />
  </g>

  <!-- Tipografia "VÔLEY" em Estilo Bloco Esportivo 3D -->
  <!-- Sombra 3D das Letras -->
  <text x="250" y="296" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="62" fill="#0284c7" letter-spacing="4">
    VÔLEY
  </text>
  <!-- Letras Principais com Gradiente Branco/Ciano -->
  <text x="250" y="293" text-anchor="middle" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="62" fill="url(#bannerGrad)" stroke="#071833" stroke-width="2" letter-spacing="4">
    VÔLEY
  </text>

  <!-- ==================== FAIXA SECUNDÁRIA "TÁTICO" ==================== -->
  <!-- Fita com Sombra -->
  <g filter="url(#dropShadow)">
    <path d="M 130 305 L 370 305 L 358 344 L 142 344 Z" fill="#030c1b" stroke="url(#goldGrad)" stroke-width="2.5" />
  </g>

  <!-- Estrelas Douradas nas Laterais de "TÁTICO" -->
  <g fill="url(#goldGrad)">
    <!-- Estrela Esquerda 1 -->
    <polygon points="152,320 154,325 159,325 155,328 157,333 152,330 148,333 149,328 145,325 150,325" />
    <!-- Estrela Direita 1 -->
    <polygon points="348,320 350,325 355,325 351,328 353,333 348,330 344,333 345,328 341,325 346,325" />
  </g>

  <!-- Texto TÁTICO -->
  <text x="250" y="333" text-anchor="middle" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="6" filter="url(#dropShadow)">
    TÁTICO
  </text>

  <!-- ==================== ARCO INFERIOR "BRAZIL" E ESTRELA ==================== -->
  <!-- Guia Invisível para o Texto em Arco Inferior -->
  <path id="bottomArc" d="M 150 358 A 150 150 0 0 0 350 358" fill="none" />
  
  <!-- Linha Decorativa Dourada Inferior -->
  <path d="M 125 355 A 160 160 0 0 0 375 355" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 140 375 A 175 175 0 0 0 360 375" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" />

  <!-- Texto BRAZIL em Arco -->
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="url(#goldLight)" letter-spacing="8">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      BRAZIL
    </textPath>
  </text>

  <!-- Estrela Dourada Central na Base Inferior -->
  <g fill="url(#goldGrad)" filter="url(#dropShadow)">
    <polygon points="250,402 254,413 266,413 257,419 260,430 250,423 240,430 243,419 234,413 246,413" />
  </g>

  <!-- Detalhes de Brilho nos Cantos da Borda -->
  <circle cx="250" cy="14" r="3" fill="#fef08a" />
  <circle cx="250" cy="486" r="3" fill="#fef08a" />
  <circle cx="14" cy="250" r="3" fill="#fef08a" />
  <circle cx="486" cy="250" r="3" fill="#fef08a" />
</svg>
